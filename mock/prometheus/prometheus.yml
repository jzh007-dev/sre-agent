global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    env: mock
    cluster: sre-agent-mock

# Load recording + alerting rules.
rule_files:
  - alerts.yml

# Where to send fired alerts.
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # Prometheus scrapes itself (health of the scraper).
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  # Our application services.
  # The `service` label is stamped HERE at scrape time (not in the app).
  # Why: service identity is a topology property; the app should not need to know
  # what it's called. This also lets us rename services without recompiling code.
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:8000]
        labels:
          service: gateway

  - job_name: checkout
    metrics_path: /metrics
    static_configs:
      - targets: [checkout:8000]
        labels:
          service: checkout

  - job_name: payment
    metrics_path: /metrics
    static_configs:
      - targets: [payment:8000]
        labels:
          service: payment

  - job_name: inventory
    metrics_path: /metrics
    static_configs:
      - targets: [inventory:8000]
        labels:
          service: inventory
