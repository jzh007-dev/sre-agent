global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    env: mock
    cluster: sre-agent-mock

scrape_configs:
  # Prometheus scrapes itself (health of the scraper).
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  # Our application services.
  # Each target's `service` label is stamped here so PromQL can filter on it
  # without depending on the service exposing it in the metric.
  - job_name: checkout
    metrics_path: /metrics
    static_configs:
      - targets: [checkout:8000]
        labels:
          service: checkout
