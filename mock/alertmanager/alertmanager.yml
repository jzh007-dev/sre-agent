# AlertManager config for the mock environment.
#
# Design notes:
# - `null-receiver` swallows alerts silently — the UI at :9093 still shows them
#   (that IS the point in Commit A: prove alerts fire end-to-end from real
#   Prometheus rules against real metrics).
# - Commit B/C will replace this with a webhook receiver that POSTs into a
#   mock incident tracker (PagerDuty-shaped API), which the agent will
#   eventually consume via its ingress.
# - group_wait / group_interval are aggressive because we want fast feedback
#   in mock. Prod defaults are ~30s / 5m.

route:
  receiver: incident-tracker
  group_by: [alertname, service]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1m

receivers:
  - name: incident-tracker
    webhook_configs:
      - url: http://incident-tracker:8000/webhook/alertmanager
        send_resolved: true
        # AlertManager retries on non-2xx; the mock tracker responds 200
        # even on partial ingest issues, so retries are quiet in practice.
