name: sre-agent-mock

# Shared build config for all 4 app services.
# Anchor `&app-build` centralizes the parameterized Dockerfile invocation;
# each service just overrides SERVICE via `<<: *app-build` + its own args.
x-app-build: &app-build
  context: services
  dockerfile: Dockerfile

x-app-labels: &app-labels
  logging: vector           # Vector only tails containers with this label

services:
  # ─── Application services ─────────────────────────────────────────
  gateway:
    build:
      <<: *app-build
      args:
        SERVICE: gateway
    image: sre-agent-mock/gateway:latest
    container_name: mock-gateway
    environment:
      SERVICE_NAME: gateway
      SERVICE_VERSION: v1.0.0
      LOG_LEVEL: INFO
      CHECKOUT_URL: http://checkout:8000
    ports:
      - "18080:8000"           # external entry point
    labels:
      <<: *app-labels
      service: gateway
    depends_on:
      - checkout
    networks:
      - mocknet
    restart: unless-stopped

  checkout:
    build:
      <<: *app-build
      args:
        SERVICE: checkout
    image: sre-agent-mock/checkout:latest
    container_name: mock-checkout
    environment:
      SERVICE_NAME: checkout
      SERVICE_VERSION: v1.0.0
      LOG_LEVEL: INFO
      PAYMENT_URL: http://payment:8000
      INVENTORY_URL: http://inventory:8000
    ports:
      - "18081:8000"
    labels:
      <<: *app-labels
      service: checkout
    depends_on:
      - payment
      - inventory
    networks:
      - mocknet
    restart: unless-stopped

  payment:
    build:
      <<: *app-build
      args:
        SERVICE: payment
    image: sre-agent-mock/payment:latest
    container_name: mock-payment
    environment:
      SERVICE_NAME: payment
      SERVICE_VERSION: v1.0.0
      LOG_LEVEL: INFO
    ports:
      - "18082:8000"
    labels:
      <<: *app-labels
      service: payment
    networks:
      - mocknet
    restart: unless-stopped

  inventory:
    build:
      <<: *app-build
      args:
        SERVICE: inventory
    image: sre-agent-mock/inventory:latest
    container_name: mock-inventory
    environment:
      SERVICE_NAME: inventory
      SERVICE_VERSION: v1.0.0
      LOG_LEVEL: INFO
    ports:
      - "18083:8000"
    labels:
      <<: *app-labels
      service: inventory
    networks:
      - mocknet
    restart: unless-stopped

  # Real Redis — the same off-the-shelf image production runs. Not a mock.
  # Fault injection happens through Redis's own admin surface: setup scripts
  # call `redis-cli CONFIG SET maxmemory`, `DEBUG POPULATE`, etc. This means
  # metric names, log signatures, and failure modes are the real thing —
  # `redis_memory_used_bytes` (via exporter) is exactly what a prod SRE
  # would query.
  #
  # Redis stands in as the representative infra dependency in the mock env.
  # Adding a second (Kafka / Postgres / Mongo) is 0 lines of agent code — the
  # agent's diagnostic tools are middleware-agnostic; specific-middleware
  # knowledge lives in the runbook RAG layer (see TRADEOFFS.md §16).
  redis:
    image: redis:7-alpine
    container_name: mock-redis
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      # Enable DEBUG POPULATE so case setup.yaml scripts can fill memory
      # without needing a real client loop. In prod this stays disabled.
      - --enable-debug-command
      - "yes"
    ports:
      - "16379:6379"
    labels:
      <<: *app-labels
      service: redis
    networks:
      - mocknet
    restart: unless-stopped

  # redis_exporter — community-standard Prometheus exporter for Redis.
  # Runs as a sidecar service, scrapes Redis over the network, and exposes
  # `redis_memory_used_bytes`, `redis_connected_clients`, `redis_up`, etc.
  # This is the same exporter used at Netflix, Coinbase, Grafana Labs et al.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0-alpine
    container_name: mock-redis-exporter
    command:
      - --redis.addr=redis://redis:6379
    ports:
      - "19121:9121"
    depends_on:
      - redis
    networks:
      - mocknet
    restart: unless-stopped

  # Auth service — user login + session verification, backed by real Redis.
  # Carries the user-visible SLO surface for change-induced (token algo)
  # and resource-induced (cache OOM) incident stories.
  auth:
    build:
      <<: *app-build
      args:
        SERVICE: auth
    image: sre-agent-mock/auth:latest
    container_name: mock-auth
    environment:
      SERVICE_NAME: auth
      SERVICE_VERSION: v1.0.0
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379
      TOKEN_VERSION: v1  # bumped to v2 in the token-upgrade case setup
    ports:
      - "18086:8000"
    labels:
      <<: *app-labels
      service: auth
    depends_on:
      - redis
    networks:
      - mocknet
    restart: unless-stopped

  # Deploy history — mock of ArgoCD/Spinnaker/GitHub Actions deploy audit.
  # Case setup.yaml files POST deploy records here before starting a run so
  # the agent's future deploy-mcp tool can query `list_recent_deploys(service, window)`.
  deploy-history:
    build:
      <<: *app-build
      args:
        SERVICE: deploy_history
    image: sre-agent-mock/deploy-history:latest
    container_name: mock-deploy-history
    environment:
      SERVICE_NAME: deploy-history
      SERVICE_VERSION: v1.0.0
      LOG_LEVEL: INFO
      DEPLOY_STORE_PATH: /data/deploys.json
    ports:
      - "18087:8000"
    labels:
      <<: *app-labels
      service: deploy-history
    volumes:
      - deploy_history_data:/data
    networks:
      - mocknet
    restart: unless-stopped

  # PagerDuty-shaped mock. Receives the AlertManager webhook, exposes a REST
  # incident state machine (triggered → acked → resolved). Closes the loop
  # from "alert fired" to "incident to act on" — the surface the agent's
  # future MCP tool will consume.
  incident-tracker:
    build:
      <<: *app-build
      args:
        SERVICE: incident_tracker
    image: sre-agent-mock/incident-tracker:latest
    container_name: mock-incident-tracker
    environment:
      SERVICE_NAME: incident-tracker
      SERVICE_VERSION: v1.0.0
      LOG_LEVEL: INFO
    ports:
      - "18085:8000"
    labels:
      <<: *app-labels
      service: incident-tracker
    networks:
      - mocknet
    restart: unless-stopped

  # ─── Metrics: Prometheus + AlertManager ──────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mock-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "19090:9090"
    depends_on:
      - alertmanager
    networks:
      - mocknet
    restart: unless-stopped

  # Real AlertManager (not a mock) — chosen because the config format IS the
  # industry standard. Alert rules in prometheus/alerts.yml route through here
  # to a null receiver (visible in UI at :19093); Commit B/C will replace the
  # receiver with a webhook pointing to the mock incident tracker.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: mock-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "19093:9093"
    networks:
      - mocknet
    restart: unless-stopped

  # ─── Logs: ClickHouse + Vector ───────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: mock-clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: sre
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "18123:8123"
      - "19000:9000"
    networks:
      - mocknet
    restart: unless-stopped

  vector:
    image: timberio/vector:0.40.0-debian
    container_name: mock-vector
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mocknet
    depends_on:
      - clickhouse
    restart: unless-stopped

networks:
  mocknet:
    driver: bridge

volumes:
  clickhouse_data:
  deploy_history_data:
