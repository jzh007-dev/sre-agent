[project]
name = "sre-agent"
version = "0.2.0"
description = "An incident copilot for SRE — deterministic harness around a ReAct kernel"
requires-python = ">=3.11"

# Runtime dependencies are added by the lesson that needs them, not up front:
#   W2 L3  openai, anthropic, langfuse   (gateway + adapters)
#   W2 L5  mcp, pyyaml, jsonpath-ng      (MCP transport + integration config)
#   W2 L7  fastapi, uvicorn, click       (ingress + srectl)
#   W4     psycopg, pgvector, sentence-transformers
# L2 is stdlib only, deliberately: the skeleton should be runnable before any
# provider account exists.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
srectl = "srectl.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# unittest.IsolatedAsyncioTestCase is used throughout, so no asyncio plugin is
# needed — pytest collects and runs these natively.

[tool.setuptools.packages.find]
include = ["agent*", "srectl*", "eval*", "mcp_servers*"]
